<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSCSWYM5dgkIfVK-uBe1oWkeU7se4fvFg",
  authDomain: "accar-web.firebaseapp.com",
  projectId: "accar-web",
  storageBucket: "accar-web.firebasestorage.app",
  messagingSenderId: "249370548582",
  appId: "1:249370548582:web:6b35298df41771113910a7"
};

const appName = "accarSalaLiturgicaApp";
const fbApp = getApps().some(a => a.name === appName)
  ? getApp(appName)
  : initializeApp(firebaseConfig, appName);
const db = getFirestore(fbApp);

const root = document.getElementById('accar-lecturas-root');
const mainContentArea = document.getElementById('main-content-area');
const spinner = document.getElementById('reading-spinner');
const textContainer = document.getElementById('reading-text');
const refTarget = document.getElementById('reading-ref');
const lblTarget = document.getElementById('reading-label');
const titleTarget = document.getElementById('reading-title');
const semanaTarget = document.getElementById('fiesta-semana-texto');
const santoLinkTarget = document.getElementById('fiesta-santo-link');
const colorTarget = document.getElementById('lecturas-color-badge');
const cicloTarget = document.getElementById('badge-ciclo');
const anioTarget = document.getElementById('badge-anio');
const datePicker = document.getElementById('lecturas-date-picker');
const barraControles = document.getElementById('lecturas-text-controls');
const botones = document.querySelectorAll('#accar-lecturas-root .accar-menu-btn');
const botonesTamano = document.querySelectorAll('#accar-lecturas-root .btn-size');
const btnThemeToggle = document.getElementById('btn-theme-toggle');
const labelThemeToggle = document.getElementById('label-theme-toggle');
const btnBackTop = document.getElementById('btn-back-top');

const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };

function sinAcentos(str) {
  return String(str || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .trim();
}

function capitalizarPalabra(str) {
  const limpio = String(str || '').toLowerCase().trim();
  return limpio ? limpio.charAt(0).toUpperCase() + limpio.slice(1) : '';
}

function verificarCristoRey(fechaISO) {
  const [y, m, d] = fechaISO.split('-').map(Number);
  const christmas = new Date(Date.UTC(y, 11, 25, 12, 0, 0));
  const dow = christmas.getUTCDay();
  const offsetFourth = dow === 0 ? 7 : dow;
  const cristoRey = new Date(christmas.getTime() - (offsetFourth + 28) * 86400000);
  if (cristoRey.getUTCMonth() + 1 === m && cristoRey.getUTCDate() === d) {
    return 'cristo-rey';
  }
  return null;
}

async function obtenerSantoPorFecha(fechaISO) {
  try {
    let idSanto = verificarCristoRey(fechaISO);
    if (!idSanto) {
      if (!window.__accarSantoralIndexCache) {
        const r = await fetch('/assets/data/santoral-index.json');
        if (r.ok) window.__accarSantoralIndexCache = await r.json();
      }
      const mmdd = fechaISO.slice(5);
      const entrada = window.__accarSantoralIndexCache?.[mmdd];
      if (entrada?.id) idSanto = entrada.id;
    }
    if (!idSanto || idSanto === 'feria') return null;

    const snap = await getDoc(doc(db, 'santos', idSanto));
    if (!snap.exists()) return null;

    const data = snap.data();
    const nombreCompleto = data.nombre_completo || '';
    const nombreCorto = nombreCompleto.split(',')[0].trim();
    return { id: idSanto, nombre: nombreCorto || nombreCompleto };
  } catch (_) {
    return null;
  }
}

// Estado compartido entre Lecturas y Oficio Divino
const estadoGuardado = window.__accarSalaLiturgica || {};
const hoyBogota = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' });
let currentDate = (estadoGuardado.keepDateOnce && estadoGuardado.fecha) ? estadoGuardado.fecha : hoyBogota;
let currentFontSize = estadoGuardado.fontSize || '18.5px';
let isLightMode = typeof estadoGuardado.isLightMode === 'boolean' ? estadoGuardado.isLightMode : true;

if (estadoGuardado.keepDateOnce) {
  estadoGuardado.keepDateOnce = false;
}

if (datePicker) datePicker.value = currentDate;

function aplicarPreferenciasLectura() {
  if (!mainContentArea || !textContainer) return;
  textContainer.style.fontSize = currentFontSize;
  botonesTamano.forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-size') === currentFontSize);
  });

  if (isLightMode) {
    mainContentArea.classList.add('theme-light');
    if (labelThemeToggle) labelThemeToggle.textContent = 'Modo Oscuro';
  } else {
    mainContentArea.classList.remove('theme-light');
    if (labelThemeToggle) labelThemeToggle.textContent = 'Modo Pergamino';
  }
}

aplicarPreferenciasLectura();

// Puente de un solo clic hacia Oficio Divino
window.irALiturgiaHorasDesdeLecturas = function() {
  window.__accarSalaLiturgica = {
    fecha: currentDate,
    keepDateOnce: true,
    fontSize: currentFontSize,
    isLightMode: isLightMode
  };
  loadView('views/inicio-breviario.html');
};

// Compartir lectura con confirmación limpia
window.shareLecturaACCAR = function(btnEl) {
  const title = titleTarget?.textContent || 'Lectura del día';
  const ref = refTarget?.textContent || '';
  const tempDiv = document.createElement('div');
  tempDiv.innerHTML = textContainer?.innerHTML || '';
  let textBody = (tempDiv.textContent || tempDiv.innerText || '').trim();
  if (textBody.length > 300) textBody = textBody.substring(0, 300) + '...';

  const shareData = {
    title: `ACCAR - ${title}`,
    text: `*${title}*\n${ref}\n\n${textBody}\n\nLee completa en:`,
    url: window.location.href
  };

  if (navigator.share) {
    navigator.share(shareData).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`).then(() => {
      const span = btnEl?.querySelector('span');
      if (span) {
        const previo = span.textContent;
        span.textContent = '✓ Lectura copiada';
        setTimeout(() => { span.textContent = previo; }, 2600);
      }
    });
  }
};

let liturgiaData = {};
let currentTarget = 'evangelio';
let cargaToken = 0;

async function cargarLecturas(fechaYYYYMMDD) {
  const miToken = ++cargaToken;
  currentDate = fechaYYYYMMDD;

  if (spinner) spinner.style.display = 'block';
  if (textContainer) textContainer.innerHTML = '';
  if (barraControles) barraControles.style.display = 'none';

  liturgiaData = {
    evangelio: { titulo: 'Evangelio', ref: '', texto: '' },
    primera: { titulo: 'Primera Lectura', ref: '', texto: '' },
    salmo: { titulo: 'Salmo Responsorial', ref: '', texto: '' },
    segunda: { titulo: 'Segunda Lectura', ref: '', texto: '' },
    reflexion: { titulo: 'Reflexión', ref: '', texto: '' }
  };

  ['evangelio', 'primera', 'salmo', 'segunda'].forEach(k => {
    const c = document.getElementById(`cita-btn-${k}`);
    if (c) c.textContent = '';
  });

  document.getElementById('btn-segunda').style.display = 'none';
  document.getElementById('btn-segunda-mobile').style.display = 'none';
  document.getElementById('btn-reflexion').style.display = 'none';
  document.getElementById('btn-reflexion-mobile').style.display = 'none';

  const fechaObj = new Date(`${fechaYYYYMMDD}T12:00:00`);
  const fechaTexto = fechaObj.toLocaleDateString('es-ES', opcionesFecha);
  const badgeFecha = document.getElementById('lecturas-fecha-actual');
  if (badgeFecha) {
    badgeFecha.textContent = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
  }

  try {
    const [resEv, santoFirestore] = await Promise.all([
      fetch(`/api/evangelizo?date=${fechaYYYYMMDD}`),
      obtenerSantoPorFecha(fechaYYYYMMDD)
    ]);

    if (miToken !== cargaToken || !document.getElementById('accar-lecturas-root')) return;

    const data = await resEv.json();
    const fiesta = data.fiestas?.[0] || {};

    // Aplicar Color del Tiempo Litúrgico en todo el recinto y botones
    const colorTiempoRaw = fiesta.colorTiempo || fiesta.color || 'VERDE';
    const colorTiempoClave = sinAcentos(colorTiempoRaw);
    root.setAttribute('data-tiempo', colorTiempoClave);

    if (cicloTarget) {
      cicloTarget.textContent = String(fiesta.ciclo || '').replace(/^CICLO\s*/i, '').trim() || '—';
    }
    if (anioTarget) {
      anioTarget.textContent = String(fiesta.anio || '').replace(/^A[ÑN]O\s*/i, '').trim() || '—';
    }
    if (colorTarget) {
      colorTarget.textContent = capitalizarPalabra(colorTiempoRaw);
    }
    if (semanaTarget) {
      semanaTarget.textContent = fiesta.semana || 'Tiempo Litúrgico';
    }

    // Mostrar Santo del Día con ortografía real y enlace a su biografía
    let nombreSantoMostrar = '';
    let idSantoEnlace = null;

    if (santoFirestore) {
      nombreSantoMostrar = santoFirestore.nombre;
      idSantoEnlace = santoFirestore.id;
    } else if (fiesta.santo && fiesta.santo.toUpperCase() !== 'FERIA') {
      nombreSantoMostrar = fiesta.santo;
    }

    if (santoLinkTarget) {
      if (nombreSantoMostrar) {
        santoLinkTarget.textContent = `✠ ${nombreSantoMostrar}`;
        santoLinkTarget.style.display = 'block';
        if (idSantoEnlace) {
          santoLinkTarget.style.cursor = 'pointer';
          santoLinkTarget.onclick = (e) => {
            e.preventDefault();
            window.santoID = idSantoEnlace;
            loadView('views/santos/santo.html');
          };
        } else {
          santoLinkTarget.style.cursor = 'default';
          santoLinkTarget.onclick = (e) => e.preventDefault();
        }
      } else {
        santoLinkTarget.style.display = 'none';
      }
    }

    // Cargar textos bíblicos
    if (Array.isArray(data.readings) && data.readings.length > 0) {
      data.readings.forEach(reading => {
        let textoLimpio = typeof reading.text === 'string' ? reading.text : reading.text.join('<br><br>');
        textoLimpio = textoLimpio.replace(/(R\/\.|R\.)/g, '<span class="accar-rubrica-roja">$1</span>');
        const refLimpia = String(reading.referencia || '').replace(/:$/, '').trim();

        if (reading.type === 'GSP') {
          liturgiaData.evangelio = { titulo: 'Evangelio', ref: refLimpia, texto: textoLimpio };
          const c = document.getElementById('cita-btn-evangelio');
          if (c) c.textContent = refLimpia;
        } else if (reading.type === 'FR') {
          liturgiaData.primera = { titulo: 'Primera Lectura', ref: refLimpia, texto: textoLimpio };
          const c = document.getElementById('cita-btn-primera');
          if (c) c.textContent = refLimpia;
        } else if (reading.type === 'PS') {
          const refSalmo = refLimpia || 'Salmo Responsorial';
          liturgiaData.salmo = { titulo: 'Salmo Responsorial', ref: refSalmo, texto: textoLimpio };
          const c = document.getElementById('cita-btn-salmo');
          if (c) c.textContent = refSalmo.replace(/Salmo\s*/i, 'Sal ');
        } else if (reading.type === 'SR') {
          liturgiaData.segunda = { titulo: 'Segunda Lectura', ref: refLimpia, texto: textoLimpio };
          const c = document.getElementById('cita-btn-segunda');
          if (c) c.textContent = refLimpia;
          document.getElementById('btn-segunda').style.display = 'flex';
          document.getElementById('btn-segunda-mobile').style.display = 'inline-flex';
        } else if (reading.type === 'RE') {
          liturgiaData.reflexion = { titulo: 'Reflexión', ref: refLimpia, texto: textoLimpio };
          document.getElementById('btn-reflexion').style.display = 'flex';
          document.getElementById('btn-reflexion-mobile').style.display = 'inline-flex';
        }
      });

      if (!liturgiaData[currentTarget]?.texto) {
        currentTarget = 'evangelio';
      }

      botones.forEach(b => {
        b.classList.toggle('active', b.getAttribute('data-target') === currentTarget);
      });

      renderReading(currentTarget);
    } else {
      lblTarget.textContent = '✠ LECCIONARIO';
      titleTarget.textContent = 'Lecturas del día';
      refTarget.textContent = '';
      textContainer.innerHTML = '<p>Las lecturas para esta fecha aún no se encuentran cargadas en el leccionario.</p>';
    }
  } catch (error) {
    console.error('Error conectando al Leccionario:', error);
    refTarget.textContent = 'Conexión interrumpida';
    textContainer.innerHTML = '<p>No fue posible descargar las lecturas del día en este momento.</p>';
  } finally {
    if (miToken === cargaToken && spinner) spinner.style.display = 'none';
  }
}

function renderReading(targetId) {
  const d = liturgiaData[targetId];
  if (!d || !d.texto) return;

  lblTarget.textContent = `✠ ${d.titulo.toUpperCase()} DE HOY`;
  titleTarget.textContent = d.titulo;

  if (!d.ref || d.ref === d.titulo) {
    refTarget.style.display = 'none';
  } else {
    refTarget.style.display = 'block';
    refTarget.textContent = d.ref;
  }

  textContainer.innerHTML = `<p>${d.texto}</p>`;
  barraControles.style.display = 'flex';
  btnBackTop.style.display = 'block';
}

btnBackTop.addEventListener('click', () => {
  root.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

botonesTamano.forEach(btn => {
  btn.addEventListener('click', () => {
    currentFontSize = btn.getAttribute('data-size') || '18.5px';
    aplicarPreferenciasLectura();
  });
});

btnThemeToggle.addEventListener('click', () => {
  isLightMode = !isLightMode;
  aplicarPreferenciasLectura();
});

botones.forEach(btn => {
  btn.addEventListener('click', () => {
    const destino = btn.getAttribute('data-target');
    if (!destino) return;
    currentTarget = destino;
    botones.forEach(b => {
      b.classList.toggle('active', b.getAttribute('data-target') === currentTarget);
    });
    renderReading(currentTarget);

    if (window.innerWidth <= 940) {
      mainContentArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  });
});

if (datePicker) {
  datePicker.addEventListener('change', (e) => {
    if (e.target.value) cargarLecturas(e.target.value);
  });
}

cargarLecturas(currentDate);
</script>
