<script>
// Función para Compartir
function shareContent() {
    const title = document.getElementById('reading-title').textContent;
    const ref = document.getElementById('reading-ref').textContent;
    
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = document.getElementById('reading-text').innerHTML;
    let textBody = tempDiv.textContent || tempDiv.innerText || "";
    
    if (textBody.length > 300) {
        textBody = textBody.substring(0, 300) + '...';
    }

    const shareData = {
        title: `ACCAR - ${title}`,
        text: `*${title}*\n${ref}\n\n${textBody}\n\nLee completa en:`,
        url: window.location.href, 
    };

    if (navigator.share) {
        navigator.share(shareData)
            .then(() => console.log('Contenido compartido con éxito'))
            .catch((error) => console.log('Error al compartir', error));
    } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`)
            .then(() => alert('¡Enlace y lectura copiados al portapapeles!'))
            .catch(err => console.error('Error al copiar texto: ', err));
    }
}

<script>
(async function initLecturas() {
  const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let fechaHoyTexto = new Date().toLocaleDateString('es-ES', opcionesFecha);
  fechaHoyTexto = fechaHoyTexto.charAt(0).toUpperCase() + fechaHoyTexto.slice(1);
  document.getElementById('lecturas-fecha-actual').textContent = fechaHoyTexto;

  const hoy = new Date();
  const mes = String(hoy.getMonth() + 1).padStart(2, '0');
  const dia = String(hoy.getDate()).padStart(2, '0');
  
  const anioAPI = hoy.getFullYear();
  const dateAPI = `${anioAPI}-${mes}-${dia}`;
  
  const apiUrl = `/api/evangelizo?date=${dateAPI}`;

  const liturgiaData = {
    evangelio: { titulo: "Evangelio", ref: "", texto: "Cargando..." },
    primera: { titulo: "Primera Lectura", ref: "", texto: "Cargando..." },
    salmo: { titulo: "Salmo", ref: "", texto: "Cargando..." },
    segunda: { titulo: "Segunda Lectura", ref: "", texto: "Cargando..." },
    reflexion: { titulo: "Reflexión", ref: "", texto: "Cargando..." }
  };

  const spinner = document.getElementById('reading-spinner');
  const textContainer = document.getElementById('reading-text');
  const refTarget = document.getElementById('reading-ref');
  const lblTarget = document.getElementById('reading-label');
  const titleTarget = document.getElementById('reading-title');
  const semanaTarget = document.getElementById('fiesta-semana');
  const santoTarget = document.getElementById('fiesta-santo');
  const colorTarget = document.getElementById('lecturas-color-badge');
  const cicloTarget = document.getElementById('badge-ciclo');
  const anioTarget = document.getElementById('badge-anio');
  
  const botones = document.querySelectorAll('.accar-menu-btn');
  
  const coloresLiturgicos = {
    "VERDE": "#2cb67d",
    "BLANCO": "#ffffff",
    "MORADO": "#9f7aea",
    "ROJO": "#fc8181",
    "ROSADO": "#fbb6ce"
  };

  // Función para aplicar saltos de párrafo inteligentemente
  const formatearGramatica = (texto) => {
      if (!texto) return '';
      // Si el texto ya trae saltos de línea de la API, los usamos
      if (texto.includes('\n')) return texto.replace(/\n/g, '<br><br>');
      
      // Si es un bloque sólido, busca puntos, signos de interrogación o exclamación 
      // seguidos de un espacio y una letra mayúscula para forzar el salto de párrafo.
      return texto.replace(/([a-záéíóúñ]{2,}[.»”?!]{1,2})\s+(?=[A-ZÁÉÍÓÚÑ¿¡])/gi, '$1<br><br>');
  };

  let apiExitosa = false;
  spinner.style.display = 'block';

  try {
    const response = await fetch(apiUrl);
    const rawText = await response.text(); 
    
    if (!response.ok) throw new Error("Error en la respuesta del servidor");
    const data = JSON.parse(rawText);

    if(data.fiestas && data.fiestas.length > 0) {
      
      // Limpiamos "Celebramos"
      let semanaLimpia = data.fiestas[0].semana || '';
      if(semanaLimpia.includes('Lecturas y Evangelio de la\n')) {
          semanaLimpia = semanaLimpia.replace('Lecturas y Evangelio de la\n', '');
      }

      if(semanaTarget) semanaTarget.textContent = semanaLimpia;
      if(santoTarget) santoTarget.textContent = data.fiestas[0].santo || '';
      
      const colorTexto = (data.fiestas[0].color || 'VERDE').toUpperCase();
      colorTarget.textContent = colorTexto;
      
      if (coloresLiturgicos[colorTexto]) {
        colorTarget.style.color = coloresLiturgicos[colorTexto];
      }
      
      if(cicloTarget) cicloTarget.textContent = data.fiestas[0].ciclo || '';
      if(anioTarget) anioTarget.textContent = data.fiestas[0].anio || '';
    } else {
      if(semanaTarget) semanaTarget.textContent = "Feria";
    }

    if (data.readings) {
      data.readings.forEach(reading => {
        const htmlText = formatearGramatica(reading.text);
        
        if (reading.type === 'GSP') { liturgiaData.evangelio.ref = reading.title; liturgiaData.evangelio.texto = htmlText; }
        else if (reading.type === 'FR') { liturgiaData.primera.ref = reading.title; liturgiaData.primera.texto = htmlText; }
        else if (reading.type === 'PS') { liturgiaData.salmo.ref = reading.title; liturgiaData.salmo.texto = htmlText; }
        else if (reading.type === 'SR') { 
          liturgiaData.segunda.ref = reading.title; 
          liturgiaData.segunda.texto = htmlText;
          document.getElementById('btn-segunda').style.display = 'block'; 
          document.getElementById('btn-segunda-mobile').style.display = 'block'; 
        }
        else if (reading.type === 'RE') { 
          liturgiaData.reflexion.ref = reading.title; 
          liturgiaData.reflexion.texto = htmlText;
          document.getElementById('btn-reflexion').style.display = 'block'; 
          document.getElementById('btn-reflexion-mobile').style.display = 'block'; 
        }
      });
      apiExitosa = true;
    }
  } catch (error) {
    console.error("Error conectando al Leccionario:", error);
    refTarget.textContent = "Error de conexión";
    textContainer.innerHTML = `<p>No pudimos descargar las lecturas del día. El sistema de la fuente original podría estar procesando los datos.</p>`;
  } finally {
    spinner.style.display = 'none';
  }

  function renderReading(targetId) {
    const d = liturgiaData[targetId];
    lblTarget.textContent = d.titulo.toUpperCase() + " DE HOY";
    titleTarget.textContent = d.titulo;
    refTarget.textContent = d.ref;
    textContainer.innerHTML = `<p>${d.texto}</p>`;
  }

  if (apiExitosa) {
    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const target = e.target.getAttribute('data-target');
        
        // Remove active class from ALL buttons
        botones.forEach(b => b.classList.remove('active'));
        
        // Add active class to corresponding buttons in BOTH menus (desktop & mobile)
        document.querySelectorAll(`.accar-menu-btn[data-target="${target}"]`).forEach(b => b.classList.add('active'));
        
        renderReading(target);
        
        // Scroll to top of content on mobile so they see what changed
        if (window.innerWidth <= 900) {
           document.querySelector('.accar-lecturas-content').scrollIntoView({ behavior: 'smooth' });
        }
      });
    });
    renderReading('evangelio'); // Default load
  }
})();
</script>
