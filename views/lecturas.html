  <div class="accar-lecturas-inner">
    
    <!-- COLUMNA IZQUIERDA: MENÚ DE NAVEGACIÓN -->
    <aside class="accar-lecturas-sidebar">
      
      <!-- Bloque: Fecha -->

        <div class="accar-date-badge" id="lecturas-fecha-actual">

      <!-- Bloque: Información Litúrgica -->
      <div class="accar-sidebar-box">

          <span class="badge-combined">
            <span id="badge-ciclo">CICLO A</span> &nbsp;|&nbsp; 
            <span id="badge-anio">AÑO II</span> &nbsp;|&nbsp; 
            <span id="lecturas-color-badge" class="dot-color">VERDE</span>
          </span>
        </div>
        <div class="accar-lit-fiesta">
          <div id="fiesta-semana">Cargando celebración...</div>
          <div id="fiesta-santo" style="margin-top: 5px; font-size: 13px; color: rgba(255,255,255,0.6);"></div>

      </div>

      <!-- Bloque: Menú de Lecturas -->
      <div class="accar-sidebar-box">

        <nav class="accar-lecturas-menu" id="lecturas-menu">
          <button class="accar-menu-btn active" data-target="evangelio">Evangelio</button>
          <button class="accar-menu-btn" data-target="primera">Primera lectura</button>

          <button class="accar-menu-btn" data-target="reflexion" id="btn-reflexion" style="display: none;">Reflexión</button>
        </nav>
      </div>

    </aside>

    <!-- COLUMNA DERECHA: ÁREA DE LECTURA -->
    <main class="accar-lecturas-content">
      
      <div class="accar-reading-header">
        <span class="accar-reading-label" id="reading-label">EVANGELIO DE HOY</span>
        <h1 id="reading-title">Evangelio</h1>
        <h3 id="reading-ref">Conectando con Magisterium...</h3>
      </div>

      <div class="accar-reading-body">
        <div class="accar-spinner" id="reading-spinner"></div>
        <div id="reading-text" class="accar-text-content">
          <!-- Aquí se inyectará el texto de la lectura -->
        </div>
      </div>

    </main>

  </div>

<style>
/* =========================================
   ESTILOS DE LA VISTA DE LECTURAS
========================================= */
.accar-lecturas-view {
  padding: 120px 20px 60px;
  background: radial-gradient(circle at top, #0f3d3e 0%, #021617 100%);
  min-height: 100vh;
  color: #f8efd3;
}

.accar-lecturas-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 320px 1fr;
  gap: 40px;
  align-items: start;
}

/* --- SIDEBAR --- */
.accar-sidebar-box {
  background: rgba(9, 23, 45, 0.6);
  border: 1px solid rgba(212, 175, 55, 0.2);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.accar-sidebar-box h4 {
  color: #fff;
  font-size: 15px;
  margin: 0 0 16px 0;
  font-weight: 700;
}

.accar-date-badge {
  background: #2cb67d; /* Verde referencia */
  color: #000;
  font-weight: 800;
  padding: 12px 16px;
  border-radius: 8px;
  font-size: 14px;
  text-align: center;
  text-transform: uppercase;
}

.accar-lit-meta-small {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.badge-combined {
  border: 1px solid rgba(212, 175, 55, 0.6); /* Borde dorado único */
  color: #ffffff; /* Texto blanco por defecto */
  font-size: 11px;
  padding: 8px 16px;
  border-radius: 50px;
  text-transform: uppercase;
  font-weight: 800;
  display: inline-block;
  letter-spacing: 0.5px;
}
.badge-combined span {
  display: inline-block;
}
/* El color se inyectará al span final mediante JS */

.dot-color::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  background: currentColor;
}

.accar-lit-fiesta {
  font-size: 14px;
  line-height: 1.5;
  color: rgba(255,255,255,0.8);
  margin: 0;
}

/* Menú de Botones */
.accar-lecturas-menu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.accar-menu-btn {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff;
  padding: 14px 20px;
  border-radius: 8px;
  text-align: left;
  font-size: 14px;

}

  background: #2cb67d;
  color: #000;
  border-color: #2cb67d;
  font-weight: 800;
  box-shadow: 0 4px 15px rgba(44, 182, 125, 0.3);
}

/* --- MAIN CONTENT --- */
.accar-lecturas-content {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid rgba(212, 175, 55, 0.15);
  border-radius: 24px;
  padding: 50px;
}

.accar-reading-label {
  color: #2cb67d;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;

#reading-title {
  color: #fff;

}

/* Spinner de carga */
.accar-spinner {
  width: 40px;

  .accar-lecturas-inner {
    grid-template-columns: 1fr;
  }
  .accar-lecturas-content {
    padding: 30px 20px;
  }

</style>

<script>
(async function initLecturas() {
  const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let fechaHoyTexto = new Date().toLocaleDateString('es-ES', opcionesFecha);
  fechaHoyTexto = fechaHoyTexto.charAt(0).toUpperCase() + fechaHoyTexto.slice(1);
  document.getElementById('lecturas-fecha-actual').textContent = fechaHoyTexto;

  const hoy = new Date();
  const mes = String(hoy.getMonth() + 1).padStart(2, '0');
  const dia = String(hoy.getDate()).padStart(2, '0');
  
  // Ya no hackeamos el año. Enviamos la fecha real exacta.
  const anioAPI = hoy.getFullYear();
  const dateAPI = `${anioAPI}-${mes}-${dia}`;
  
  const apiUrl = `/api/evangelizo?date=${dateAPI}`;

  const liturgiaData = {
    evangelio: { titulo: "Evangelio", ref: "", texto: "Cargando..." },
    primera: { titulo: "Primera Lectura", ref: "", texto: "Cargando..." },
    salmo: { titulo: "Salmo", ref: "", texto: "Cargando..." },
    segunda: { titulo: "Segunda Lectura", ref: "", texto: "Cargando..." },
    reflexion: { titulo: "Reflexión", ref: "", texto: "Cargando..." }
  };

  const spinner = document.getElementById('reading-spinner');
  const textContainer = document.getElementById('reading-text');
  const refTarget = document.getElementById('reading-ref');
  const lblTarget = document.getElementById('reading-label');
  const titleTarget = document.getElementById('reading-title');
  const semanaTarget = document.getElementById('fiesta-semana');
  const santoTarget = document.getElementById('fiesta-santo');
  const colorTarget = document.getElementById('lecturas-color-badge');
  const cicloTarget = document.getElementById('badge-ciclo');
  const anioTarget = document.getElementById('badge-anio');
  const botones = document.querySelectorAll('.accar-menu-btn');
  
  // Mapeo dinámico: Ahora solo cambia el color del texto y el punto
  const coloresLiturgicos = {
    "VERDE": "#2cb67d",
    "BLANCO": "#ffffff",
    "MORADO": "#9f7aea",
    "ROJO": "#fc8181",
    "ROSADO": "#fbb6ce"
  };

  let apiExitosa = false;
  spinner.style.display = 'block';

  try {
    const response = await fetch(apiUrl);
    const rawText = await response.text(); 
    
    if (!response.ok) throw new Error("Error en la respuesta del servidor");
    const data = JSON.parse(rawText);

    if(data.fiestas && data.fiestas.length > 0) {
      // Inyectar textos separados
      if(semanaTarget) semanaTarget.textContent = data.fiestas[0].semana || '';
      if(santoTarget) santoTarget.textContent = data.fiestas[0].santo || '';
      
      const colorTexto = (data.fiestas[0].color || 'VERDE').toUpperCase();
      colorTarget.textContent = colorTexto;
      
      // Aplicar color únicamente a la palabra del color y su punto
      if (coloresLiturgicos[colorTexto]) {
        colorTarget.style.color = coloresLiturgicos[colorTexto];
      }
      
      if(cicloTarget) cicloTarget.textContent = data.fiestas[0].ciclo || '';
      if(anioTarget) anioTarget.textContent = data.fiestas[0].anio || '';
    } else {
      if(semanaTarget) semanaTarget.textContent = "Feria";
    }

    if (data.readings) {
      data.readings.forEach(reading => {
        const htmlText = reading.text ? reading.text.replace(/\n/g, '<br><br>') : '';
        
        if (reading.type === 'GSP') { liturgiaData.evangelio.ref = reading.title; liturgiaData.evangelio.texto = htmlText; }
        else if (reading.type === 'FR') { liturgiaData.primera.ref = reading.title; liturgiaData.primera.texto = htmlText; }
        else if (reading.type === 'PS') { liturgiaData.salmo.ref = reading.title; liturgiaData.salmo.texto = htmlText; }
        else if (reading.type === 'SR') { 
          liturgiaData.segunda.ref = reading.title; 
          liturgiaData.segunda.texto = htmlText;
          document.getElementById('btn-segunda').style.display = 'block'; 
        }
        else if (reading.type === 'RE') { 
          liturgiaData.reflexion.ref = reading.title; 
          liturgiaData.reflexion.texto = htmlText;
          document.getElementById('btn-reflexion').style.display = 'block'; 
        }
      });
      apiExitosa = true;
    }
  } catch (error) {
    console.error("Error conectando con Magisterium:", error);
    refTarget.textContent = "Error de conexión";
    textContainer.innerHTML = `<p>No pudimos descargar las lecturas del día. El sistema de Magisterium podría estar procesando los datos.</p>`;
  } finally {
    spinner.style.display = 'none';
  }

  function renderReading(targetId) {
    const d = liturgiaData[targetId];
    lblTarget.textContent = d.titulo.toUpperCase() + " DE HOY";
    titleTarget.textContent = d.titulo;
    refTarget.textContent = d.ref;
    textContainer.innerHTML = `<p>${d.texto}</p>`;
  }

  if (apiExitosa) {
    botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
        botones.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderReading(e.target.getAttribute('data-target'));
      });
    });
    renderReading('evangelio');
  }
})();
</script>
