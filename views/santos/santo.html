    apiKey: "AIzaSyDSCSWYM5dgkIfVK-uBe1oWkeU7se4fvFg",
    authDomain: "accar-web.firebaseapp.com",
    projectId: "accar-web",
    storageBucket: "accar-web.firebasestorage.app",
    messagingSenderId: "249370548582",
    appId: "1:249370548582:web:6b35298df41771113910a7"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getFirestore(app);

const santoID = window.santoID || "san-oscar-romero";
const mainSantoral = document.getElementById("app-santoral");
const container = document.getElementById("santo-container");
const loading = document.getElementById("loading");

// Limpiar cualquier clase heredada en body para no teñir otras vistas
document.body.classList.remove("theme-rojo", "theme-blanco", "theme-verde", "theme-morado", "theme-celeste", "theme-negro", "theme-realeza", "theme-gloria");

window.navegarDesdeSanto = function(vista, mesRetorno = null) {
    document.body.classList.remove("theme-rojo", "theme-blanco", "theme-verde", "theme-morado", "theme-celeste", "theme-negro", "theme-realeza", "theme-gloria");
    if (mesRetorno) {
        window.mesRetornoSantoral = mesRetorno;
    }
    loadView(vista);
};

function normalizarImagenSanto(ruta) {
    if (!ruta) return "";
    let limpia = ruta.trim();
    if (limpia.startsWith("../../")) limpia = "/" + limpia.slice(6);
    else if (limpia.startsWith("../")) limpia = "/" + limpia.slice(3);
    else if (!limpia.startsWith("/") && !limpia.startsWith("http://") && !limpia.startsWith("https://")) {
        limpia = "/" + limpia;
    }
    return limpia;
}

function formatearProsaSagrada(texto) {
    if (!texto) return "";
    const str = String(texto).trim();
    if (/<p[\s>]|<br\s*\/?>/i.test(str)) {
        return `<p>${str}</p>`;
    }
    return str
        .split(/\n\s*\n/)
        .map(bloque => `<p>${bloque.trim().replace(/\n/g, "<br>")}</p>`)
        .join("");
}

function formatearLeccion(lec) {
    const str = String(lec || "").trim();
    if (!str || /<strong[\s>]/i.test(str)) return str;
    const idx = str.indexOf(":");
    if (idx > 0 && idx < 68) {
        return `<strong>${str.slice(0, idx + 1)}</strong>${str.slice(idx + 1)}`;
    }
    return str;
}

if (santoID) {
    try {
        const docRef = doc(db, "santos", santoID);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();

            const sinAcentos = (txt = "") =>
                String(txt).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();

            const todosLosTemas = ["rojo", "blanco", "blanco-hueso", "crema", "verde", "morado", "celeste", "negro", "realeza", "gloria"];
            const temasClaros = ["celeste", "blanco-hueso", "crema", "blanco", "gloria"];

            const colorRaw = sinAcentos(data.color || "blanco").trim();
            const textoClave = `${sinAcentos(data.nombre_completo || "")} ${sinAcentos(data.patronazgo || "")}`;

            let temaElegido = "crema";
            if (["rojo", "verde", "morado", "negro", "realeza", "gloria", "celeste", "crema", "blanco-hueso"].includes(colorRaw)) {
                temaElegido = colorRaw;
            } else if (colorRaw === "hueso") {
                temaElegido = "blanco-hueso";
            } else {
                // Cuando el color litúrgico base es blanco, distinguimos según la dignidad del santo
                if (/\b(virgen maria|nuestra senora|madre de dios|inmaculada concepcion|asuncion de la|bienaventurada virgen|corazon inmaculado|dulce nombre de maria|santa maria la mayor)\b/.test(textoClave)) {
                    temaElegido = "celeste";
                } else if (/\b(jesucristo|nuestro senor|santisima trinidad|corpus christi|sagrado corazon de jesus|transfiguracion|ascension del senor|epifania|natividad del senor|bautismo del senor)\b/.test(textoClave)) {
                    temaElegido = "gloria";
                } else if (/\b(virgen|virgenes)\b/.test(textoClave)) {
                    temaElegido = "blanco-hueso";
                } else {
                    temaElegido = "crema";
                }
            }

            if (mainSantoral) {
                todosLosTemas.forEach(t => mainSantoral.classList.remove(`santo-tema-${t}`));
                mainSantoral.classList.remove("santo-lienzo-claro");
                mainSantoral.classList.add(`santo-tema-${temaElegido}`);
                if (temasClaros.includes(temaElegido)) {
                    mainSantoral.classList.add("santo-lienzo-claro");
                }
            }

            const mesesValidos = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            let mesValido = null;
            if (data.fecha_texto && data.fecha_texto.includes(" de ")) {
                const posibleMes = data.fecha_texto.split(" de ").pop().trim();
                const encontrado = mesesValidos.find(m => m.toLowerCase() === posibleMes.toLowerCase());
                if (encontrado) mesValido = encontrado;
            }

            const migasMesHTML = mesValido
                ? `<a href="/ver/santoral" onclick="event.preventDefault(); window.navegarDesdeSanto('views/santos/inicio-santos.html', '${mesValido}');">${mesValido}</a> <span class="accar-bc-sep">›</span>`
                : "";

            const leccionesHTML = Array.isArray(data.lecciones) && data.lecciones.length
                ? data.lecciones.map(lec => `<li>${formatearLeccion(lec)}</li>`).join("")
                : "";

            const santosAdicionalesHTML = Array.isArray(data.santos_adicionales) && data.santos_adicionales.length
                ? data.santos_adicionales.map(santo => `<li>${santo}</li>`).join("")
                : "";

            const imgPath = normalizarImagenSanto(data.imagen);

            document.title = `${data.nombre_completo || "Santo del Día"} | ACCAR`;

            container.innerHTML = `
                <div class="accar-santo-topbar">
                  <nav class="accar-santo-MinimalBc" aria-label="Ruta de navegación">
                    <a href="/" onclick="event.preventDefault(); window.navegarDesdeSanto('views/inicio.html');">Inicio</a>
                    <span class="accar-bc-sep">›</span>
                    <a href="/ver/santoral" onclick="event.preventDefault(); window.navegarDesdeSanto('views/santos/inicio-santos.html');">Santoral</a>
                    <span class="accar-bc-sep">›</span>
                    ${migasMesHTML}
                    <span class="accar-bc-current">${data.fecha_texto || ""}</span>
                  </nav>
                </div>

                <header class="accar-santo-hero">
                  ${imgPath ? `
                  <div class="accar-santo-portrait">
                    <img src="${imgPath}" alt="${data.nombre_completo || ""}" onerror="this.onerror=null; this.parentElement.style.display='none';">
                  </div>` : ""}

                  <div class="accar-santo-head">
                    ${data.fecha_texto ? `<div class="accar-santo-kicker"><span>✠</span><span>${data.fecha_texto}</span><span>✠</span></div>` : ""}
                    <h1 class="accar-santo-title santo-nombre">${data.nombre_completo || ""}</h1>
                    <div class="accar-santo-rule" aria-hidden="true"></div>
                    ${data.patronazgo ? `<p class="accar-santo-subtitle">${data.patronazgo}</p>` : ""}
                  </div>
                </header>

                <div class="accar-santo-article">
                  <h2 class="accar-santo-section-title">Biografía Espiritual</h2>
                  <div class="accar-santo-prose">
                    ${formatearProsaSagrada(data.biografia)}
                  </div>

                  ${data.frase ? `
                  <blockquote class="accar-santo-quote">
                    <div class="accar-santo-quote-label">✠ Palabras de ${data.nombre_completo || "este Santo"}</div>
                    <p class="accar-santo-quote-body">${data.frase}</p>
                  </blockquote>` : ""}

                  ${leccionesHTML ? `
                  <h2 class="accar-santo-section-title">Lecciones Espirituales</h2>
                  <ul class="accar-lecciones-list">${leccionesHTML}</ul>` : ""}

                  ${data.cita_biblica ? `
                  <h2 class="accar-santo-section-title">Cita Bíblica</h2>
                  <div class="accar-cita-biblica">${data.cita_biblica}</div>` : ""}

                  ${data.meditacion ? `
                  <h2 class="accar-santo-section-title">Meditación del Día</h2>
                  <div class="accar-santo-prose">
                    ${formatearProsaSagrada(data.meditacion)}
                  </div>` : ""}

                  ${data.oracion ? `
                  <div class="accar-oracion-card">
                    <h3 class="accar-oracion-head">✠ Oración ✠</h3>
                    <div class="accar-oracion-body">
                      ${formatearProsaSagrada(data.oracion)}
                    </div>
                  </div>` : ""}

                  ${santosAdicionalesHTML ? `
                  <h2 class="accar-santo-section-title">También se celebran hoy</h2>
                  <ul class="accar-santos-adicionales">${santosAdicionalesHTML}</ul>` : ""}
                </div>
            `;

            loading.style.display = "none";
            container.style.display = "block";
        } else {
            loading.innerHTML = "Ficha del santo no encontrada en Firebase.";
        }
    } catch (error) {
        console.error("Error cargando de Firebase:", error);
        if (loading) loading.innerHTML = "Error al conectar con la base de datos.";
    }
}
</script>
