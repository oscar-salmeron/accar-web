<main id="app-santoral" class="santo-background">
  <div id="loading" class="spinner">Abriendo el Martirologio...</div>
  <article id="santo-container" style="display: none;"></article>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDSCSWYM5dgkIfVK-uBe1oWkeU7se4fvFg",
    authDomain: "accar-web.firebaseapp.com",
    projectId: "accar-web",
    storageBucket: "accar-web.firebasestorage.app",
    messagingSenderId: "249370548582",
    appId: "1:249370548582:web:6b35298df41771113910a7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Usar variable global inyectada por loadView, con fallback seguro
const santoID = window.santoID || "san-oscar-romero";

const container = document.getElementById('santo-container');
const loading = document.getElementById('loading');

// Función auxiliar para navegar limpiando TODOS los fondos litúrgicos
window.navegarDesdeSanto = function(vista, mesRetorno = null) {
    document.body.classList.remove('theme-rojo', 'theme-blanco', 'theme-verde', 'theme-morado', 'theme-celeste', 'theme-negro');
    if (mesRetorno) {
        window.mesRetornoSantoral = mesRetorno;
    }
    loadView(vista);
};

if (santoID) {
    try {
        const docRef = doc(db, "santos", santoID);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            // Asegurarnos de limpiar cualquier color anterior antes de aplicar el nuevo
            document.body.classList.remove('theme-rojo', 'theme-blanco', 'theme-verde', 'theme-morado', 'theme-celeste', 'theme-negro');
            // Aplicar color litúrgico dinámico desde Firebase (por defecto blanco si no existe)
            const colorLiturgico = data.color ? data.color.toLowerCase() : 'blanco';
            document.body.classList.add(`theme-${colorLiturgico}`); 

            const mesNombre = data.fecha_texto ? data.fecha_texto.split(" de ")[1] : "Mes";
            let leccionesHTML = data.lecciones ? data.lecciones.map(lec => `<li>${lec}</li>`).join('') : '';
            let santosAdicionalesHTML = data.santos_adicionales ? data.santos_adicionales.map(santo => `<li>${santo}</li>`).join('') : '';

            let imgPath = data.imagen || '';
            if(imgPath.startsWith('../../')) imgPath = imgPath.replace('../../', '');

            container.innerHTML = `
                <header class="santo-hero">
                  <div class="santo-img">
                    <img src="${imgPath}" alt="${data.nombre_completo || ''}" onerror="this.onerror=null; this.style.display='none';">
                  </div>
                  <div class="santo-head">
                    <div class="santo-fecha">✝ ${data.fecha_texto || ''}</div>
                    <h1 class="santo-nombre">${data.nombre_completo || ''}</h1>
                    <div class="santo-subtitulo">${data.patronazgo || ''}</div>
                  </div>
                </header>

                <nav class="breadcrumb">
                  <a href="#" onclick="event.preventDefault(); window.navegarDesdeSanto('views/inicio.html');">Inicio</a> / 
                  <a href="#" onclick="event.preventDefault(); window.navegarDesdeSanto('views/santos/inicio-santos.html');">Santoral</a> / 
                  <a href="#" onclick="event.preventDefault(); window.navegarDesdeSanto('views/santos/inicio-santos.html', '${mesNombre}');">${mesNombre}</a> / 
                  <span class="bc-dia">${data.fecha_texto || ''}</span>
                </nav>

                <div class="santo-content">
                  <h2>Biografía Espiritual</h2>
                  <p>${data.biografia || ''}</p>

                  ${data.frase ? `
                  <blockquote>
                    <div class="titulo-frase">Frase de ${data.nombre_completo}</div>
                    ${data.frase}
                  </blockquote>` : ''}
                  
                  ${data.lecciones ? `
                  <h2>Lecciones Espirituales</h2>
                  <ul class="lecciones-list">${leccionesHTML}</ul>
                  ` : ''}

                  ${data.cita_biblica ? `
                  <h2>Cita Bíblica</h2>
                  <div class="texto-cita-biblica"><em>${data.cita_biblica}</em></div>
                  ` : ''}

                  ${data.meditacion ? `
                  <h2>Meditación del Día</h2>
                  <p>${data.meditacion}</p>
                  ` : ''}

                  ${data.oracion ? `
                  <div class="recuadro-espiritual">
                    <h3>Oración</h3>
                    <p>${data.oracion}</p>
                  </div>
                  ` : ''}

                  ${data.santos_adicionales ? `
                  <h2>También se celebran hoy</h2>
                  <ul class="lecciones-list" style="margin-bottom: 0;">${santosAdicionalesHTML}</ul>
                  ` : ''}
                </div>
            `;
            loading.style.display = 'none';
            container.style.display = 'block';
        } else {
            loading.innerHTML = "Ficha del santo no encontrada en Firebase.";
        }
    } catch (error) {
        console.error("Error cargando de Firebase:", error);
        if(loading) loading.innerHTML = "Error al conectar con la base de datos.";
    }
}
</script>
