<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Santo del Día - ACCAR</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== FONDO DINÁMICO ===== */
  body {
    margin: 0;
    font-family: 'EB Garamond', serif;
    background: radial-gradient(circle at top, #0f3d3e 0%, #021617 100%);
    transition: background 0.8s ease;
    color: #f8efd3;
    overflow-x: hidden;
  }

  body.theme-rojo { background: radial-gradient(circle at top, #7f1d1d 0%, #450a0a 100%); }
  body.theme-blanco { background: radial-gradient(circle at top, #1e3a8a 0%, #0f172a 100%); }
  body.theme-morado { background: radial-gradient(circle at top, #581c87 0%, #2e1065 100%); }

  #app { padding: 60px 20px 100px; }

  /* ===== HEADER IMPACTO ===== */
  .santo-hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    margin-bottom: 50px;
    max-width: 1000px;
    margin-left: auto;
    margin-right: auto;
  }
  .santo-img { flex: 0 0 280px; }
  .santo-img img {
    width: 100%;
    border-radius: 16px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.25);
    /* Manejo visual si la imagen no carga */
    background-color: #2a2a2a; 
    min-height: 350px;
  }
  .santo-head { color: #f6f1e6; max-width: 620px; }
  .santo-fecha { color: #e3c46a; font-size: 20px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
  .santo-nombre { font-family: 'Cinzel', serif; font-size: 44px; margin: 10px 0; color: #ffffff; text-shadow: 0 4px 14px rgba(0,0,0,0.6); }
  .santo-subtitulo { font-size: 18px; color: #d4af37; font-weight: 600; }

  /* ===== BREADCRUMB ===== */
  .breadcrumb {
    max-width: 1000px;
    margin: 0 auto 40px auto;
    font-size: 16px;
    color: #e3c46a;
  }
  .breadcrumb a { color: #e3c46a; text-decoration: none; transition: 0.3s; }
  .breadcrumb a:hover { color: #ffffff; }
  .bc-dia { color: #ffffff; }

  /* ===== PERGAMINO ÚNICO ===== */
  .santo-content {
    max-width: 1000px;
    margin: 0 auto;
    padding: 70px 80px;
    background: #fdf6e3;
    border-radius: 18px;
    box-shadow: 0 60px 140px rgba(0,0,0,0.75);
    position: relative;
    color: #1a1c29;
  }
  .santo-content::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 2px;
    background: linear-gradient(120deg, #d4af37, #fff2c6, #b48c2a);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    pointer-events: none;
  }

  /* ===== TIPOGRAFÍA INTERIOR ===== */
  h2 {
    font-family: 'Cinzel', serif;
    color: #8b0000;
    margin-top: 50px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(139,0,0,0.2);
    font-size: 24px;
    text-transform: uppercase;
  }
  h2:first-child { margin-top: 0; }
  
  p { 
    line-height: 1.85; 
    font-size: 20px; 
    margin-bottom: 20px; 
    text-align: justify; 
  }
  strong { color: #8b0000; }
  
  blockquote {
    font-style: italic;
    background: rgba(212,175,55,0.1);
    border-left: 4px solid #d4af37;
    padding: 20px;
    margin: 25px 0;
    color: #333;
    font-size: 20px;
  }

  ul.lecciones-list {
    list-style-type: none;
    padding-left: 0;
  }
  ul.lecciones-list li {
    position: relative;
    padding-left: 25px;
    margin-bottom: 15px;
    font-size: 20px;
    line-height: 1.7;
  }
  ul.lecciones-list li::before {
    content: "•";
    color: #d4af37;
    font-size: 24px;
    position: absolute;
    left: 0;
    top: -4px;
  }

  /* ===== RECUADRO ESPIRITUAL ===== */
  .recuadro-espiritual {
    margin-top: 50px;
    padding: 40px;
    border-radius: 12px;
    background: linear-gradient(145deg, #1e3a8a, #0f172a);
    color: #ffffff;
    border: 1px solid rgba(212,175,55,0.4);
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .recuadro-espiritual h3 { font-family: 'Cinzel', serif; color: #d4af37; margin-top: 0; text-transform: uppercase; font-size: 22px; }
  .recuadro-espiritual p { color: #f6f1e6; margin-bottom: 0; font-size: 19px; }

  /* SPINNER */
  .spinner { text-align: center; color: #d4af37; font-size: 20px; padding: 50px; font-family: 'Cinzel', serif; }

  @media(max-width:900px){
    #app { padding: 40px 15px; }
    .santo-hero { flex-direction: column; text-align: center; gap: 25px; }
    .santo-img { width: 220px; margin: 0 auto; }
    .santo-content { padding: 40px 25px; }
    .santo-nombre { font-size: 32px; }
  }
</style>
</head>
<body>

<main id="app">
  <div id="loading" class="spinner">Abriendo el Martirologio...</div>
  
  <article id="santo-container" style="display: none;">
    <!-- Contenido Dinámico inyectado por JS -->
  </article>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDSCSWYM5dgkIfVK-uBe1oWkeU7se4fvFg",
    authDomain: "accar-web.firebaseapp.com",
    projectId: "accar-web",
    storageBucket: "accar-web.firebasestorage.app",
    messagingSenderId: "249370548582",
    appId: "1:249370548582:web:6b35298df41771113910a7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

document.addEventListener("DOMContentLoaded", async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const santoID = urlParams.get('id');

    const container = document.getElementById('santo-container');
    const loading = document.getElementById('loading');

    if (!santoID) {
        loading.innerHTML = "No se especificó ningún santo en la URL.";
        return;
    }

    try {
        const docRef = doc(db, "santos", santoID);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
            const data = docSnap.data();
            document.body.classList.add('theme-rojo'); 

            const mesNombre = data.fecha_texto ? data.fecha_texto.split(" de ")[1] : "Mes";
            let leccionesHTML = data.lecciones ? data.lecciones.map(lec => `<li>${lec}</li>`).join('') : '';
            let santosAdicionalesHTML = data.santos_adicionales ? data.santos_adicionales.map(santo => `<li>${santo}</li>`).join('') : '';

            container.innerHTML = `
                <header class="santo-hero">
                  <div class="santo-img">
                    <img src="${data.imagen || ''}" alt="${data.nombre_completo || ''}" onerror="this.onerror=null; this.style.display='none';">
                  </div>
                  <div class="santo-head">
                    <div class="santo-fecha">✝ ${data.fecha_texto || ''}</div>
                    <h1 class="santo-nombre">${data.nombre_completo || ''}</h1>
                    <div class="santo-subtitulo">${data.patronazgo || ''}</div>
                  </div>
                </header>

                <nav class="breadcrumb">
                  <a href="../inicio.html">Inicio</a> / 
                  <a href="inicio-santos.html">Santoral</a> / 
                  <a href="#">${mesNombre}</a> / 
                  <span class="bc-dia">${data.fecha_texto || ''}</span>
                </nav>

                <div class="santo-content">
                  <h2>Biografía Espiritual</h2>
                  <p>${data.biografia || ''}</p>

                  ${data.frase ? `<blockquote>${data.frase}</blockquote>` : ''}
                  
                  ${data.lecciones ? `
                  <h2>Lecciones Espirituales</h2>
                  <ul class="lecciones-list">${leccionesHTML}</ul>
                  ` : ''}

                  ${data.cita_biblica ? `
                  <h2>Cita Bíblica</h2>
                  <p><em>${data.cita_biblica}</em></p>
                  ` : ''}

                  ${data.meditacion ? `
                  <h2>Meditación del Día</h2>
                  <p>${data.meditacion}</p>
                  ` : ''}

                  ${data.oracion ? `
                  <div class="recuadro-espiritual">
                    <h3>Oración</h3>
                    <p>${data.oracion}</p>
                  </div>
                  ` : ''}

                  ${data.santos_adicionales ? `
                  <h2>También se celebran hoy</h2>
                  <ul class="lecciones-list" style="margin-bottom: 0;">${santosAdicionalesHTML}</ul>
                  ` : ''}
                </div>
            `;
            loading.style.display = 'none';
            container.style.display = 'block';
        } else {
            loading.innerHTML = "Ficha del santo no encontrada en Firebase.";
        }
    } catch (error) {
        console.error("Error cargando de Firebase:", error);
        loading.innerHTML = "Error al conectar con la base de datos.";
    }
});
</script>
</body>
</html>
