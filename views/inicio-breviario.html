<div class="accar-container">
  <div class="accar-card">
    
    <!-- CABECERA DINÁMICA -->
    <div id="brev-header-container" class="accar-brev-header">
      <h2 id="brev-fecha-titulo">Cargando fecha...</h2>
      <p id="brev-semana-titulo">Cargando semana...</p>
    </div>

    <!-- BOTONERA DE HORAS -->
    <div class="accar-brev-botonera">
      <button class="accar-brev-btn" data-hora="ufficio">Oficio de lectura</button>
      <button class="accar-brev-btn" data-hora="laudi">Laudes</button>
      <button class="accar-brev-btn" data-hora="media">Hora Intermedia</button>
      <button class="accar-brev-btn" data-hora="vespri">Vísperas</button>
      <button class="accar-brev-btn" data-hora="compieta">Completas</button>
    </div>

    <!-- ÁREA DE LECTURA -->
    <div class="accar-brev-content-area">
      <!-- Barra de herramientas de lectura (Oculta por defecto) -->
      <div class="accar-text-controls" id="brev-text-controls" style="display: none;">
        <button class="accar-text-btn" id="btn-theme-toggle" title="Cambiar a fondo oscuro">🌙 Fondo Oscuro</button>
        <div style="flex-grow: 1;"></div>
        <span class="accar-text-controls-label">Tamaño:</span>
        <button class="accar-text-btn btn-size active" data-size="15px">A-</button>

      <!-- Botón compartir (Escritorio) -->
      <button class="accar-btn-compartir" id="btn-share-desktop" onclick="shareBreviario()" style="display: none; margin-bottom: 20px;">
          Compartir liturgia
      </button>

      <div class="accar-spinner" id="brev-spinner" style="display: none;"></div>
      <div id="brev-text" class="accar-brev-text theme-light">
        <p style="text-align: center; opacity: 0.7; padding: 40px 0;">Selecciona una hora litúrgica para comenzar a rezar.</p>
      </div>
      
      <!-- Botón de regresar arriba (Oculto por defecto) -->
      <button id="btn-back-top" class="accar-back-top" style="display: none;">⬆ Volver al menú</button>
    </div>

  </div>
</div>

<!-- Menú fijo inferior para móviles -->
<div class="accar-mobile-nav-container" id="brev-mobile-nav">
    <button class="accar-mobile-share-btn" onclick="shareBreviario()">
        Lleva esta liturgia a más almas <span>^</span>
    </button>
    <div class="accar-mobile-menu-scroll" id="brev-menu-mobile">
        <button class="accar-brev-btn active" data-hora="ufficio">Oficio</button>
        <button class="accar-brev-btn" data-hora="laudi">Laudes</button>
        <button class="accar-brev-btn" data-hora="media">Intermedia</button>
        <button class="accar-brev-btn" data-hora="vespri">Vísperas</button>
        <button class="accar-brev-btn" data-hora="compieta">Completas</button>
    </div>
</div>

<script>
let currentLiturgiaTitle = "Liturgia de las Horas";

function shareBreviario() {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = document.getElementById('brev-text').innerHTML;
    let textBody = tempDiv.textContent || tempDiv.innerText || "";
    
    if (textBody.length > 300) {
        textBody = textBody.substring(0, 300) + '...';
    }

    const shareData = {
        title: `ACCAR - ${currentLiturgiaTitle}`,
        text: `*${currentLiturgiaTitle}*\n\n${textBody}\n\nLee completa en:`,
        url: window.location.href, 
    };

    if (navigator.share) {
        navigator.share(shareData)
            .catch((error) => console.log('Error al compartir', error));
    } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`)
            .then(() => alert('¡Enlace y liturgia copiados al portapapeles!'))
            .catch(err => console.error('Error al copiar texto: ', err));
    }
}

(async function initBreviario() {
  const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let fechaHoyTexto = new Date().toLocaleDateString('es-ES', opcionesFecha);
  fechaHoyTexto = fechaHoyTexto.charAt(0).toUpperCase() + fechaHoyTexto.slice(1);
  
  const headerFecha = document.getElementById('brev-fecha-titulo');
  const headerSemana = document.getElementById('brev-semana-titulo');
  const headerContainer = document.getElementById('brev-header-container');
  
  headerFecha.textContent = fechaHoyTexto;

  try {
      const today = new Date();
      const dateAPI = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const responseMeta = await fetch(`/api/evangelizo?date=${dateAPI}`);
      if (responseMeta.ok) {
          const dataMeta = await responseMeta.json();
          if (dataMeta.fiestas && dataMeta.fiestas.length > 0) {
              const fiesta = dataMeta.fiestas[0];
              let semanaLimpia = fiesta.semana || '';
              semanaLimpia = semanaLimpia.replace(/Lecturas y Evangelio de la\s*\n?/i, '').trim();
              headerSemana.textContent = `${semanaLimpia} (${fiesta.anio || ''})`;
              
              const coloresHex = { "VERDE": "#2cb67d", "BLANCO": "#e2e8f0", "MORADO": "#6b21a8", "ROJO": "#b91c1c", "ROSADO": "#f472b6" };
              const colorLiturgico = fiesta.color ? fiesta.color.toUpperCase() : 'VERDE';
              if (coloresHex[colorLiturgico]) {
                  headerContainer.style.backgroundColor = coloresHex[colorLiturgico];
                  if(colorLiturgico === 'BLANCO') {
                      headerContainer.style.color = '#1a1c29';
                      headerContainer.querySelector('h2').style.color = '#1a1c29';
                      headerContainer.querySelector('p').style.color = '#1a1c29';
                  }
              }
          }
      }
  } catch (err) {
      console.log("Error al cargar metadatos.", err);
  }

  const textContainer = document.getElementById('brev-text');
  const spinner = document.getElementById('brev-spinner');
  const botonesMenu = document.querySelectorAll('.accar-brev-btn');
  const barraControles = document.getElementById('brev-text-controls');
  const botonesTamano = document.querySelectorAll('.btn-size');
  const btnThemeToggle = document.getElementById('btn-theme-toggle');
  const btnBackTop = document.getElementById('btn-back-top');

  // Lógica de Regresar Arriba
  btnBackTop.addEventListener('click', () => {
      document.querySelector('.accar-brev-botonera').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  // Lógica de tamaño
  botonesTamano.forEach(btn => {
      btn.addEventListener('click', (e) => {
          botonesTamano.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          textContainer.style.fontSize = e.target.getAttribute('data-size');
      });
  });

  // Lógica de Cambio de Color (Beige por defecto a Oscuro)
  let isLightMode = true;
  btnThemeToggle.addEventListener('click', () => {
      isLightMode = !isLightMode;
      if (isLightMode) {
          textContainer.classList.add('theme-light');
          btnThemeToggle.innerHTML = '🌙 Fondo Oscuro';
      } else {
          textContainer.classList.remove('theme-light');
          btnThemeToggle.innerHTML = '☀️ Fondo Claro';
      }
  });

  const btnShareDesktop = document.getElementById('btn-share-desktop');

  async function loadHora(horaParam, btnElement) {
      spinner.style.display = 'block';
      textContainer.style.display = 'none';
      barraControles.style.display = 'none'; 
      btnBackTop.style.display = 'none'; 
      if(btnShareDesktop) btnShareDesktop.style.display = 'none';
      
      if(btnElement) {
          currentLiturgiaTitle = btnElement.textContent.trim();
      }
      
      try {
          const response = await fetch(`/api/breviario?hora=${horaParam}`);
          if (!response.ok) throw new Error("Error del servidor interno");
          
          const data = await response.json();
          
          if(data.html && data.html.length > 50) {
             textContainer.innerHTML = data.html;
             barraControles.style.display = 'flex'; 
             btnBackTop.style.display = 'block'; 
             if(btnShareDesktop) btnShareDesktop.style.display = 'inline-flex';
          } else {
             textContainer.innerHTML = "<p style='text-align:center;'>La liturgia de las horas no está disponible aún en la fuente.</p>";
          }
      } catch (error) {
          textContainer.innerHTML = "<p style='text-align:center; color: #ff4d4d;'>Ocurrió un error al cargar el texto de la liturgia.</p>";
      } finally {
          spinner.style.display = 'none';
          textContainer.style.display = 'block';
      }
  }

  botonesMenu.forEach(btn => {
      btn.addEventListener('click', (e) => {
          const targetHora = e.target.getAttribute('data-hora');
          
          // Sincronizar estado visual de los botones (escritorio y móvil)
          botonesMenu.forEach(b => {
              if (b.getAttribute('data-hora') === targetHora) {
                  b.classList.add('active');
              } else {
                  b.classList.remove('active');
              }
          });
          
          loadHora(targetHora, e.target);
          
          // En móvil, hacer scroll suave al contenido tras hacer clic
          if (window.innerWidth <= 900) {
              document.querySelector('.accar-brev-content-area').scrollIntoView({ behavior: 'smooth' });
          }
      });
  });

})();
</script>
