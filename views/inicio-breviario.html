<div class="accar-container">
  <div class="accar-card">
    
    <!-- CABECERA DINÁMICA -->
    <div id="brev-header-container" class="accar-brev-header">
      <h2 id="brev-fecha-titulo">Cargando fecha...</h2>
      <p id="brev-semana-titulo">Cargando semana...</p>
    </div>

    <!-- BOTONERA DE HORAS -->
    <div class="accar-brev-botonera">
      <button class="accar-brev-btn" data-hora="ufficio">Oficio de lectura</button>
      <button class="accar-brev-btn" data-hora="laudi">Laudes</button>
      <button class="accar-brev-btn" data-hora="media">Hora Intermedia</button>
      <button class="accar-brev-btn" data-hora="vespri">Vísperas</button>
      <button class="accar-brev-btn" data-hora="compieta">Completas</button>
    </div>

    <!-- ÁREA DE LECTURA -->
    <div class="accar-brev-content-area">
      <!-- Barra de herramientas de lectura (Oculta por defecto) -->
      <div class="accar-text-controls" id="brev-text-controls" style="display: none;">
        <span class="accar-text-controls-label">Tamaño del texto:</span>
        <button class="accar-text-btn" data-size="15px">A-</button>
        <button class="accar-text-btn active" data-size="18px">A</button>
        <button class="accar-text-btn" data-size="22px">A+</button>
      </div>

      <div class="accar-spinner" id="brev-spinner" style="display: none;"></div>
      <div id="brev-text" class="accar-brev-text">
        <p style="text-align: center; color: rgba(255,255,255,0.5); padding: 40px 0;">Selecciona una hora litúrgica para comenzar a rezar.</p>
      </div>
    </div>

  </div>
</div>

<style>
/* --- ESTILOS PRINCIPALES RESTAURADOS --- */
.accar-container {
  padding: 20px;
  max-width: 800px;
  margin: 0 auto;
}
.accar-card {
  background-color: #1a1c29;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 20px;
}
.accar-brev-header {
  background-color: #2cb67d;
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  margin-bottom: 20px;
  transition: background-color 0.3s ease;
}
.accar-brev-header h2 { color: white; margin: 0 0 5px 0; font-size: 22px; font-weight: bold;}
.accar-brev-header p { color: white; margin: 0; font-size: 14px; text-transform: uppercase; font-weight: bold; }

.accar-brev-botonera {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 20px;
}
.accar-brev-btn {
  background-color: #f8f9fa;
  border: none;
  padding: 15px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 16px;
  color: #1a1c29;
  cursor: pointer;
  transition: all 0.3s ease;
}
.accar-brev-btn:hover { background-color: #e2e8f0; }
.accar-brev-btn.active {
  background-color: #d4af37;
  color: white;
  box-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
}

/* --- BARRA DE TAMAÑO DE TEXTO --- */
.accar-text-controls {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  padding-bottom: 15px;
}
.accar-text-controls-label {
  font-size: 14px;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
}
.accar-text-btn {
  background: transparent;
  border: 1px solid rgba(212, 175, 55, 0.4);
  color: #e7dcc5;
  padding: 4px 10px;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.2s ease;
}
.accar-text-btn:hover { background: rgba(212, 175, 55, 0.1); }
.accar-text-btn.active {
  background: #d4af37;
  color: #1a1c29;
  border-color: #d4af37;
}

/* --- ÁREA DE TEXTO LECTURA --- */
.accar-brev-text {
  font-size: 18px; 
  line-height: 1.8;
  color: #e7dcc5 !important;
  transition: font-size 0.3s ease;
}
.accar-brev-text font[color="black"],
.accar-brev-text font[color="#000000"],
.accar-brev-text span[style*="color: black"],
.accar-brev-text span[style*="color:#000000"] {
  color: #e7dcc5 !important; 
}
.accar-spinner {
  border: 4px solid rgba(255, 255, 255, 0.1);
  border-left-color: #d4af37;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 20px auto;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
(async function initBreviario() {
  const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let fechaHoyTexto = new Date().toLocaleDateString('es-ES', opcionesFecha);
  fechaHoyTexto = fechaHoyTexto.charAt(0).toUpperCase() + fechaHoyTexto.slice(1);
  
  const headerFecha = document.getElementById('brev-fecha-titulo');
  const headerSemana = document.getElementById('brev-semana-titulo');
  const headerContainer = document.getElementById('brev-header-container');
  
  headerFecha.textContent = fechaHoyTexto;

  try {
      const today = new Date();
      const dateAPI = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const responseMeta = await fetch(`/api/evangelizo?date=${dateAPI}`);
      if (responseMeta.ok) {
          const dataMeta = await responseMeta.json();
          if (dataMeta.fiestas && dataMeta.fiestas.length > 0) {
              const fiesta = dataMeta.fiestas[0];
              let semanaLimpia = fiesta.semana || '';
              semanaLimpia = semanaLimpia.replace(/Lecturas y Evangelio de la\s*\n?/i, '').trim();
              headerSemana.textContent = `${semanaLimpia} (${fiesta.anio || ''})`;
              
              const coloresHex = { "VERDE": "#2cb67d", "BLANCO": "#e2e8f0", "MORADO": "#6b21a8", "ROJO": "#b91c1c", "ROSADO": "#f472b6" };
              const colorLiturgico = fiesta.color ? fiesta.color.toUpperCase() : 'VERDE';
              if (coloresHex[colorLiturgico]) {
                  headerContainer.style.backgroundColor = coloresHex[colorLiturgico];
                  if(colorLiturgico === 'BLANCO') {
                      headerContainer.style.color = '#1a1c29';
                      headerContainer.querySelector('h2').style.color = '#1a1c29';
                      headerContainer.querySelector('p').style.color = '#1a1c29';
                  }
              }
          }
      }
  } catch (err) {
      console.log("Error al cargar metadatos.", err);
  }

  const textContainer = document.getElementById('brev-text');
  const spinner = document.getElementById('brev-spinner');
  const botonesMenu = document.querySelectorAll('.accar-brev-btn');
  const barraControles = document.getElementById('brev-text-controls');
  const botonesTamano = document.querySelectorAll('.accar-text-btn');

  botonesTamano.forEach(btn => {
      btn.addEventListener('click', (e) => {
          botonesTamano.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          textContainer.style.fontSize = e.target.getAttribute('data-size');
      });
  });

  async function loadHora(horaParam) {
      spinner.style.display = 'block';
      textContainer.style.display = 'none';
      barraControles.style.display = 'none'; 
      
      try {
          const response = await fetch(`/api/breviario?hora=${horaParam}`);
          if (!response.ok) throw new Error("Error del servidor interno");
          
          const data = await response.json();
          
          if(data.html && data.html.length > 50) {
             textContainer.innerHTML = data.html;
             barraControles.style.display = 'flex'; 
          } else {
             textContainer.innerHTML = "<p style='text-align:center;'>La liturgia de las horas no está disponible aún en la fuente.</p>";
          }
      } catch (error) {
          textContainer.innerHTML = "<p style='text-align:center; color: #ff4d4d;'>Ocurrió un error al cargar el texto de la liturgia.</p>";
      } finally {
          spinner.style.display = 'none';
          textContainer.style.display = 'block';
      }
  }

  botonesMenu.forEach(btn => {
      btn.addEventListener('click', (e) => {
          botonesMenu.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const hora = e.target.getAttribute('data-hora');
          loadHora(hora);
      });
  });

})();
</script>
