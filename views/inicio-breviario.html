<div class="accar-container">
  <div class="accar-card">
    
    <!-- CABECERA DINÁMICA CON CALENDARIO -->
    <div id="brev-header-container" class="accar-brev-header">
      <div class="accar-date-picker-container">
        <label for="brev-date-picker" class="accar-date-label">Seleccionar fecha:</label>
        <input type="date" id="brev-date-picker" class="accar-date-input">
      </div>
      <h2 id="brev-fecha-titulo">Cargando fecha...</h2>
      <p id="brev-semana-titulo" style="display: none;">Cargando semana...</p>
    </div>

    <!-- BOTONERA DE HORAS -->
    <div class="accar-brev-botonera">
      <button class="accar-brev-btn" data-hora="ufficio">Oficio de lectura</button>
      <button class="accar-brev-btn" data-hora="laudi">Laudes</button>
      <button class="accar-brev-btn" data-hora="media">Hora Intermedia</button>
      <button class="accar-brev-btn" data-hora="vespri">Vísperas</button>
      <button class="accar-brev-btn" data-hora="compieta">Completas</button>

      <button class="accar-btn-compartir" id="btn-share-desktop" onclick="shareBreviario()" style="display: none; justify-content: center; margin-top: 10px;">

      </button>

    <!-- ÁREA DE LECTURA -->

      </div>

</div>

/* --- BOTÓN REGRESAR ARRIBA --- */
.accar-back-top {

@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

<script>
let currentLiturgiaTitle = "Liturgia de las Horas";

function shareBreviario() {
    const tempDiv = document.createElement('div');
    tempDiv.innerHTML = document.getElementById('brev-text').innerHTML;
    let textBody = tempDiv.textContent || tempDiv.innerText || "";
    
    if (textBody.length > 300) {
        textBody = textBody.substring(0, 300) + '...';
    }

    const shareData = {
        title: `ACCAR - ${currentLiturgiaTitle}`,
        text: `*${currentLiturgiaTitle}*\n\n${textBody}\n\nLee completa en:`,
        url: window.location.href, 
    };

    if (navigator.share) {
        navigator.share(shareData)
            .catch((error) => console.log('Error al compartir', error));
    } else {
        navigator.clipboard.writeText(`${shareData.text} ${shareData.url}`)
            .then(() => alert('¡Enlace y liturgia copiados al portapapeles!'))
            .catch(err => console.error('Error al copiar texto: ', err));
    }
}

(async function initBreviario() {
    // 1. Inicialización de Elementos del DOM
    const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    const headerFecha = document.getElementById('brev-fecha-titulo');
    const headerSemana = document.getElementById('brev-semana-titulo');
    const headerContainer = document.getElementById('brev-header-container');
    const datePicker = document.getElementById('brev-date-picker');
    const textContainer = document.getElementById('brev-text');
    const spinner = document.getElementById('brev-spinner');
    const botonesMenu = document.querySelectorAll('.accar-brev-btn');
    const barraControles = document.getElementById('brev-text-controls');
    const botonesTamano = document.querySelectorAll('.btn-size');
    const btnThemeToggle = document.getElementById('btn-theme-toggle');
    const btnBackTop = document.getElementById('btn-back-top');
    const btnShareDesktop = document.getElementById('btn-share-desktop');
    
    let selectedDateString = ""; 
    let currentActiveHora = null;

    // 2. Configurar fecha inicial inmediatamente y actualizar DOM
    const hoyStr = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Bogota' }); 
    if(datePicker) {
        datePicker.value = hoyStr;
    }
    
    // Función síncrona para actualizar solo el texto de la fecha rápida y visualmente
    function setFechaVisual(fechaStr) {
        const fechaObj = new Date(`${fechaStr}T12:00:00`);
        let fechaTexto = fechaObj.toLocaleDateString('es-ES', opcionesFecha);
        if(headerFecha) {
            headerFecha.textContent = fechaTexto.charAt(0).toUpperCase() + fechaTexto.slice(1);
        }
    }

    // Establecemos la fecha visual de arranque para que no diga "Cargando fecha..."
    setFechaVisual(hoyStr);
    
    // Y lanzamos la petición a la API de Evangelizo de forma independiente
    cargarMetadatos(hoyStr);
    selectedDateString = hoyStr;

    // 3. Evento de cambio de calendario
    if(datePicker) {
        datePicker.addEventListener('change', (e) => {
            const nuevaFecha = e.target.value;
            if (nuevaFecha) {
                selectedDateString = nuevaFecha;
                setFechaVisual(nuevaFecha);
                cargarMetadatos(nuevaFecha);
                
                if (currentActiveHora) {
                    const activeBtn = Array.from(botonesMenu).find(b => b.classList.contains('active'));
                    loadHora(currentActiveHora, activeBtn);
                }
            }
        });
    }

    // 4. Función aislada para llamar a Evangelizo
    async function cargarMetadatos(fechaYYYYMMDD) {
        try {
            const responseMeta = await fetch(`/api/evangelizo?date=${fechaYYYYMMDD}`);
            if (responseMeta.ok) {
                const dataMeta = await responseMeta.json();
                if (dataMeta.fiestas && dataMeta.fiestas.length > 0) {
                    const fiesta = dataMeta.fiestas[0];
                    let semanaLimpia = fiesta.semana || '';
                    // Extraemos solo el texto relevante de la semana, limpiando el prefijo
                    semanaLimpia = semanaLimpia.replace(/Lecturas y Evangelio de la\s*\n?/i, '').trim();
                    // Si la cadena original tenía un número romano, aseguramos que se muestre
                    if (!semanaLimpia.toUpperCase().includes('SEMANA')) {
                        // Intentamos extraer el número romano de la cadena original si es posible
                        const match = (fiesta.semana || '').match(/([IVXLCDM]+)\s+Semana/i);
                        if (match) {
                            semanaLimpia = `${match[1]} Semana del ${semanaLimpia}`;
                        } else {
                            semanaLimpia = `Semana del ${semanaLimpia}`;
                        }
                    }
                    // 1. Mostrar la Semana y el Santo debajo (ej. San Carlos Borromeo)
                    const textoSanto = fiesta.santo && fiesta.santo.toUpperCase() !== "FERIA" ? fiesta.santo : "";
                    
                    if(headerSemana) {
                        let htmlSemana = `${semanaLimpia} (${fiesta.anio || ''})`;
                        if (textoSanto) {
                            htmlSemana += `<br><span style="font-size: 11px; display: inline-block; margin-top: 5px; border-top: 1px solid rgba(0,0,0,0.1); padding-top: 4px;">${textoSanto}</span>`;
                        }
                        headerSemana.innerHTML = htmlSemana;
                        headerSemana.style.display = 'block';
                    }
                    
                    const colorLiturgico = fiesta.color ? fiesta.color.toUpperCase() : 'VERDE';

                    // --- SISTEMA DE HERENCIA LITÚRGICA BREVIARIO ---
                    const paletaBrev = {
                        "VERDE":  { bgApp: "radial-gradient(circle at top, #0f3d3e 0%, #021617 100%)", bgCajas: "#2cb67d", text: "#1a1c29" },
                        "BLANCO": { bgApp: "radial-gradient(circle at top, #b09e66 0%, #302610 100%)", bgCajas: "#ffffff", text: "#1a1c29" },
                        "ROJO":   { bgApp: "radial-gradient(circle at top, #4a0d0d 0%, #170202 100%)", bgCajas: "#dc2626", text: "#ffffff" },
                        "MORADO": { bgApp: "radial-gradient(circle at top, #3b154d 0%, #15061c 100%)", bgCajas: "#7e22ce", text: "#ffffff" },
                        "ROSADO": { bgApp: "radial-gradient(circle at top, #823853 0%, #33121f 100%)", bgCajas: "#f472b6", text: "#1a1c29" }
                    };

                    const themeBrev = paletaBrev[colorLiturgico] || paletaBrev["VERDE"];

                    // 1. Colorear el fondo general
                    document.body.style.background = themeBrev.bgApp;

                    // 2. Colorear la caja de "Seleccionar Fecha" y sus textos
                    if (headerContainer) {
                        headerContainer.style.backgroundColor = themeBrev.bgCajas;
                        headerContainer.style.color = themeBrev.text;
                        if(headerFecha) headerFecha.style.color = themeBrev.text;
                        if(headerSemana) headerSemana.style.color = themeBrev.text;
                        
                        // Asegurar que el label "Seleccionar fecha" se lea bien (si es blanco oscuro, si es rojo blanco)
                        const dateLabel = headerContainer.querySelector('.accar-date-label');
                        if (dateLabel) {
                            dateLabel.style.color = themeBrev.text === "#1a1c29" ? "rgba(0,0,0,0.7)" : "rgba(255,255,255,0.9)";
                        }
                    }

                    // 3. Función para pintar los botones del Breviario
                    const updateBrevColors = () => {
                        document.querySelectorAll('.accar-brev-btn').forEach(b => {
                            if (b.classList.contains('active')) {
                                b.style.backgroundColor = themeBrev.bgCajas;
                                b.style.color = themeBrev.text;
                                // Pequeño ajuste para que no se vea plano
                                b.style.boxShadow = `0 0 12px ${themeBrev.bgCajas}80`; 
                            } else {
                                b.style.backgroundColor = '#f8f9fa';
                                b.style.color = '#1a1c29';
                                b.style.boxShadow = 'none';
                            }
                        });
                    };

                    // Ejecutar coloración inicial y escuchar clics en botones
                    updateBrevColors();
                    botonesMenu.forEach(btn => {
                        btn.addEventListener('click', updateBrevColors);
                    });
                }
            }
        } catch (err) {
            console.log("Error al cargar metadatos.", err);
        }
    }

    // 5. Carga de la liturgia
    async function loadHora(horaParam, btnElement) {
        if(spinner) spinner.style.display = 'block';
        if(textContainer) textContainer.style.display = 'none';
        if(barraControles) barraControles.style.display = 'none'; 
        if(btnBackTop) btnBackTop.style.display = 'none'; 
        if(btnShareDesktop) btnShareDesktop.style.display = 'none';
        
        if(btnElement) {
            currentLiturgiaTitle = btnElement.textContent.trim();
        }
        currentActiveHora = horaParam;
        
        try {
            const response = await fetch(`/api/breviario?hora=${horaParam}&fecha=${selectedDateString}`);
            if (!response.ok) throw new Error("Error del servidor interno");
            
            const data = await response.json();
            
            if(data.html && data.html.length > 50) {
               if(textContainer) textContainer.innerHTML = data.html;
               if(barraControles) barraControles.style.display = 'flex'; 
               if(btnBackTop) btnBackTop.style.display = 'block'; 
               if(btnShareDesktop) btnShareDesktop.style.display = 'inline-flex';
            } else {
               if(textContainer) textContainer.innerHTML = "<p style='text-align:center;'>La liturgia de las horas no está disponible aún en la fuente.</p>";
            }
        } catch (error) {
            if(textContainer) textContainer.innerHTML = "<p style='text-align:center; color: #ff4d4d;'>Ocurrió un error al cargar el texto de la liturgia.</p>";
        } finally {
            if(spinner) spinner.style.display = 'none';
            if(textContainer) textContainer.style.display = 'block';
        }
    }

    // 6. Controles de UI
    botonesMenu.forEach(btn => {
        btn.addEventListener('click', (e) => {
            const targetHora = e.target.getAttribute('data-hora');
            
            botonesMenu.forEach(b => {
                if (b.getAttribute('data-hora') === targetHora) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });
            
            loadHora(targetHora, e.target);
            
            if (window.innerWidth <= 900) {
                const contentArea = document.querySelector('.accar-brev-content-area');
                if(contentArea) contentArea.scrollIntoView({ behavior: 'smooth' });
            }
        });
    });

    if(btnBackTop) {
        btnBackTop.addEventListener('click', () => {
            document.querySelector('.accar-brev-botonera').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    }

    botonesTamano.forEach(btn => {
        btn.addEventListener('click', (e) => {
            botonesTamano.forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            if(textContainer) textContainer.style.fontSize = e.target.getAttribute('data-size');
        });
    });

    let isLightMode = true;
    if(btnThemeToggle) {
        btnThemeToggle.addEventListener('click', () => {
            isLightMode = !isLightMode;
            if (isLightMode) {
                if(textContainer) textContainer.classList.add('theme-light');
                btnThemeToggle.innerHTML = '🌙 Fondo Oscuro';
            } else {
                if(textContainer) textContainer.classList.remove('theme-light');
                btnThemeToggle.innerHTML = '☀️ Fondo Claro';
            }
        });
    }
})();
</script>
