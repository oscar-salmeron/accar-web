<script>
(async function initBreviario() {
  const opcionesFecha = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
  let fechaHoyTexto = new Date().toLocaleDateString('es-ES', opcionesFecha);
  fechaHoyTexto = fechaHoyTexto.charAt(0).toUpperCase() + fechaHoyTexto.slice(1);
  
  const headerFecha = document.getElementById('brev-fecha-titulo');
  const headerSemana = document.getElementById('brev-semana-titulo');
  const headerContainer = document.getElementById('brev-header-container');
  
  headerFecha.textContent = fechaHoyTexto;

  // 1. Obtener la metadata litúrgica desde tu endpoint actual (evangelizo) para pintar la cabecera
  try {
      const today = new Date();
      const dateAPI = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
      const responseMeta = await fetch(`/api/evangelizo?date=${dateAPI}`);
      if (responseMeta.ok) {
          const dataMeta = await responseMeta.json();
          if (dataMeta.fiestas && dataMeta.fiestas.length > 0) {
              const fiesta = dataMeta.fiestas[0];
              
              // Limpiar la semana para mostrar solo la designación romana
              let semanaLimpia = fiesta.semana || '';
              semanaLimpia = semanaLimpia.replace(/Lecturas y Evangelio de la\s*\n?/i, '').trim();
              headerSemana.textContent = `${semanaLimpia} (Año ${fiesta.anio || ''})`;
              
              // Aplicar color a la cabecera
              const coloresHex = {
                  "VERDE": "#2cb67d",
                  "BLANCO": "#e2e8f0",
                  "MORADO": "#6b21a8",
                  "ROJO": "#b91c1c",
                  "ROSADO": "#f472b6"
              };
              const colorLiturgico = fiesta.color ? fiesta.color.toUpperCase() : 'VERDE';
              if (coloresHex[colorLiturgico]) {
                  headerContainer.style.backgroundColor = coloresHex[colorLiturgico];
                  // Si el color es blanco, oscurecer el texto para que se lea
                  if(colorLiturgico === 'BLANCO') {
                      headerContainer.style.color = '#1a1c29';
                      headerContainer.querySelector('h2').style.color = '#1a1c29';
                      headerContainer.querySelector('p').style.color = '#1a1c29';
                  }
              }
          }
      }
  } catch (err) {
      console.log("No se pudo cargar la metadata para la cabecera.", err);
  }

  // 2. Lógica para cargar los textos de las Horas desde la nueva API
  const textContainer = document.getElementById('brev-text');
  const spinner = document.getElementById('brev-spinner');
  const botones = document.querySelectorAll('.accar-brev-btn');

  async function loadHora(horaParam) {
      spinner.style.display = 'block';
      textContainer.style.display = 'none';
      
      try {
          const response = await fetch(`/api/breviario?hora=${horaParam}`);
          if (!response.ok) throw new Error("Error del servidor");
          
          const data = await response.json();
          
          if(data.html && data.html.length > 50) {
             textContainer.innerHTML = data.html;
          } else {
             textContainer.innerHTML = "<p style='text-align:center;'>El texto de esta hora aún no está disponible para el día de hoy en la fuente oficial.</p>";
          }
      } catch (error) {
          textContainer.innerHTML = "<p style='text-align:center; color: #ff4d4d;'>Ocurrió un error al cargar el breviario. Por favor intenta de nuevo más tarde.</p>";
      } finally {
          spinner.style.display = 'none';
          textContainer.style.display = 'block';
      }
  }

  // Event Listeners para los botones
  botones.forEach(btn => {
      btn.addEventListener('click', (e) => {
          botones.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          const hora = e.target.getAttribute('data-hora');
          loadHora(hora);
      });
  });

})();
</script>
